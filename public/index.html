<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8d8e6" />
  <title>Для тебя ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="ambient ambient--one"></div>
  <div class="ambient ambient--two"></div>
  <div class="ambient ambient--three"></div>

  <main class="app" aria-live="polite">
    <section class="card" id="questionCard">
      <div class="eyebrow" id="progressText"></div>
      <h1 class="question" id="questionText"></h1>

      <div class="actions">
        <button class="button button--yes" id="yesButton" type="button">
          Да
        </button>

        <button class="button button--no" id="noButton" type="button" aria-label="Нет">
          Нет
        </button>
      </div>
    </section>

    <section class="final hidden" id="finalScreen">
      <div class="final__heart">❤</div>
      <h2 class="final__title">Тогда это свидание!</h2>
      <p class="final__text">До встречи ❤️</p>
    </section>
  </main>

  <canvas id="celebrationCanvas" aria-hidden="true"></canvas>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
